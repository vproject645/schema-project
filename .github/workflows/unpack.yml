name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ./*.zip
          rm ./*.zip
          rm -rf schema-project-main/.github
          cp -a schema-project-main/. .
          rm -rf schema-project-main
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Unpack zip"
          git push
